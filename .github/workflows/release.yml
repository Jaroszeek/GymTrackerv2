name: Release

# A8: a tag vX.Y.Z builds the signed release APK and publishes it as a GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The tag gives versionName and versionCode (app/build.gradle.kts checks MINOR and PATCH < 100)
      - name: Check tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must be vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Release notes: the CHANGELOG.md section "## X.Y.Z" up to the next "## "
      - name: Release notes
        run: |
          awk -v v="$VERSION" '$1 == "##" { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section ## $VERSION"; exit 1; }

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        # --ignore-garbage: a secret piped from PowerShell may end with CRLF
        run: echo "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.jks"

      - name: Lint, unit tests, signed release build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintRelease testDebugUnitTest assembleRelease -PappVersion="$VERSION"

      # Without the secrets Gradle builds app-release-unsigned.apk, which the updater could never install
      - name: Check signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::Release APK is unsigned; set the KEYSTORE_* and KEY_* secrets (README)"; exit 1; }
          cp "$apk" "GymTracker-$VERSION.apk"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "GymTracker-$VERSION.apk" --title "GymTracker $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports
